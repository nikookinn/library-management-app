apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: library-dev

resources:
  - ../../base

# The CI job "update-gitops-state" updates this on every push to `dev`, using the new
# `sha-<commit>` tag. We never use `latest` here.
images:
  - name: library-management-application
    newTag: unset
