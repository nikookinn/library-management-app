plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.nikookinn'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// Version pinned above Spring Boot's dependency-management BOM default (which currently resolves to
	// 42.7.11) to pull in the fix for CVE-2026-54291 (SCRAM-SHA-256-PLUS downgrade MITM bypass), flagged by
	// the Trivy severity gate in CI.
	runtimeOnly 'org.postgresql:postgresql:42.7.13'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

dependencyCheck {
	// Fail the build on anything High or Critical (CVSS >= 7.0); the plugin's own default (11) never fails,
	// so this must be set explicitly to avoid silently ignoring known-exploitable dependencies.
	failBuildOnCVSS = 7.0
	formats = ['HTML', 'JSON']
	suppressionFiles = ['config/dependency-check/suppressions.xml']
	data.directory = System.getenv('DEPENDENCY_CHECK_DATA_DIR') ?: "${System.properties['user.home']}/.dependency-check-data"

	def apiKeyFromEnv = System.getenv('NVD_API_KEY')
	if (apiKeyFromEnv) {
		nvd.apiKey = apiKeyFromEnv
		nvd.delay = 10000
		nvd.maxRetryCount = 3
	}

	analyzers.assemblyEnabled = false
	analyzers.nodeAudit.enabled = false
	analyzers.retirejs.enabled = false
}
