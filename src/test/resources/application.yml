spring:
  application:
    name: Library-Management-Application
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LXNob3VsZC1iZS0zMi1ieXRlcy1sb25n
  expiration-ms: 3600000

app:
  admin:
    email: admin@test.local
    password: test-admin-password
  upload:
    dir: test-uploads
