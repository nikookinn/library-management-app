spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    connect-retries: 10
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Baseline for existing production schema"

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.nikookinn.librarymanagement: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${ENVIRONMENT:production}

app:
  admin:
    email: ${INITIAL_ADMIN_EMAIL}
    password: ${INITIAL_ADMIN_PASSWORD}
