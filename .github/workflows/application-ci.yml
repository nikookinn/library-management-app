name: Application CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - production
    tags:
      - 'v*.*.*'
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'Dockerfile'
      - '.github/workflows/application-ci.yml'
  pull_request:
    branches:
      - dev
      - staging
      - production
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'Dockerfile'
      - '.github/workflows/application-ci.yml'

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/production' && github.ref != 'refs/heads/main' }}

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          if-no-files-found: warn

      - name: Assemble application jar
        run: ./gradlew bootJar --no-daemon

      # Checks the dependencies in the built jar (build/libs) for known vulnerabilities. This replaces the
      # old OWASP dependency-check job, which used the NVD API and often failed or was slow due to rate
      # limits. Now Trivy is the only scanner: it checks the dependencies here and the container image
      # later in the container-image job. Pinned to a commit SHA, not a tag, for the same security reason
      # explained on the image-scan steps below.
      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: build/libs
          format: table
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      - name: Verify container image builds
        run: docker build -t library-management-application:ci .

  container-image:
    name: Build, scan, and publish container image
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/library-management-application"
          SHA_TAG="${IMAGE}:sha-${{ github.sha }}"
          TAG_ARGS="-t ${SHA_TAG}"

          if [ "${{ github.ref_type }}" = "branch" ]; then
            TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${{ github.ref_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_ARGS="${TAG_ARGS} -t ${IMAGE}:${{ github.ref_name }}"
          fi

          {
            echo "image=${IMAGE}"
            echo "sha_tag=${SHA_TAG}"
            echo "tag_args=${TAG_ARGS}"
          } >> "$GITHUB_OUTPUT"

      # every image carries the Git commit SHA as an OCI revision label in addition to the sha-<commit> tag,
      # so the exact source revision is always recoverable from `docker inspect`, independent of any tag.
      - name: Build container image
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label "org.opencontainers.image.created=${CREATED}" \
            ${{ steps.meta.outputs.tag_args }} .

      - name: Publish vulnerability report (informational)
        if: always()
        # Pinned to the commit SHA for v0.36.0 (not a mutable tag): aquasecurity/trivy-action and its
        # dependency aquasecurity/setup-trivy were compromised in a supply-chain attack (tags 0.0.1-0.34.2
        # affected); the poisoned tags were later deleted, breaking any workflow referencing them by tag.
        # A commit SHA cannot be silently retargeted or deleted the way a tag can.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          exit-code: '0'

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-scan-report
          path: trivy-results.sarif
          retention-days: 7
          if-no-files-found: warn

      # Security gate: any CRITICAL or HIGH finding (the same High/Critical threshold used by the
      # dependency-check job) fails this step and stops the job before the publish steps ever run, so a
      # vulnerable image can never be pushed. Findings can never be silently ignored: `ignore-unfixed: false`
      # means even vulnerabilities without a published fix still fail the build.
      - name: Scan image for vulnerabilities (severity gate)
        # Pinned to the commit SHA for v0.36.0, see comment on the report-publishing step above.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      # Publishing only ever happens on a push event (never on a pull_request) and only after the build and
      # both severity-gated scan steps above have succeeded, per the workflow's default fail-fast behavior.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish container image
        if: github.event_name == 'push'
        run: docker push --all-tags ${{ steps.meta.outputs.image }}
